appId: com.stratmind.app
productName: StratMind

directories:
  buildResources: public
  output: release

files:
  - dist/**/*
  - electron-main.js
  - preload.js
  - package.json
  - node_modules/**/*

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StratMind

portable:
  artifactName: StratMind-${version}-portable.exe

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  category: Office
